services:
  - type: web
    name: codecontext-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://codecontext-ai-tdyp.vercel.app,http://localhost:5173,http://localhost:5174
      - key: DATABASE_URL
        value: sqlite:///./codecontext.db
